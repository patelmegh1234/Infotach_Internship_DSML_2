version: "3.9"

# ──────────────────────────────────────────────────────────────
# AtmoGraph — Docker Compose
# Services: Neo4j | Redis | FastAPI Backend | NLP Worker | Frontend
#
# Quick start:
#   cp .env.example .env        # fill in secrets
#   docker compose up -d        # start all services
#   docker compose logs -f      # tail logs
#   docker compose down -v      # stop and remove volumes
# ──────────────────────────────────────────────────────────────

services:

  # ────────────────────────────────────────────────────────────
  # Neo4j — Graph Database
  # Browser: http://localhost:7474
  # Bolt:    bolt://localhost:7687
  # ────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: atmograph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-atmograph2026}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      # Mount Cypher scripts so init-neo4j.sh can execute them
      - ./scripts/cypher:/var/lib/neo4j/import/cypher:ro
      # Auto-init script runs on first container startup
      - ./scripts/docker/init-neo4j.sh:/docker-entrypoint-initdb.d/init-neo4j.sh:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-atmograph2026}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - atmograph-network

  # ────────────────────────────────────────────────────────────
  # Redis — Message Queue & Response Caching
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: atmograph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-atmograph2026}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-atmograph2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atmograph-network

  # ────────────────────────────────────────────────────────────
  # FastAPI Backend — REST API + WebSocket + GNN Inference
  # API docs: http://localhost:8000/docs
  # Health:   http://localhost:8000/api/health
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .                      # repo root — so requirements.txt is reachable
      dockerfile: backend/Dockerfile
    image: atmograph-backend:dev
    container_name: atmograph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-atmograph2026}
      REDIS_URL: redis://:${REDIS_PASSWORD:-atmograph2026}@redis:6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_PATH: /app/models/gnn_model.pt
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app               # hot-reload: code changes reflect instantly
      - model_data:/app/models       # persist trained GNN model
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - atmograph-network

  # ────────────────────────────────────────────────────────────
  # NLP Worker — Background headline → DisruptionEvent processor
  # Reads from Redis queue  nlp:queue:incoming
  # Writes to Redis queue   nlp:queue:events
  # ────────────────────────────────────────────────────────────
  nlp-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: atmograph-backend:dev     # reuses the same image as backend
    container_name: atmograph-nlp-worker
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-atmograph2026}
      REDIS_URL: redis://:${REDIS_PASSWORD:-atmograph2026}@redis:6379
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m nlp.worker
    networks:
      - atmograph-network

  # ────────────────────────────────────────────────────────────
  # React Frontend — Dashboard (Dimple's React Flow UI)
  # App: http://localhost:3000
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    image: atmograph-frontend:dev
    container_name: atmograph-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000/ws
      # Vite uses VITE_ prefix — set both for compatibility
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
      # Allow CRA dev server to listen on all interfaces
      HOST: 0.0.0.0
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"    # needed for hot-reload inside Docker on Windows
    volumes:
      - ./frontend:/app              # hot-reload
      - /app/node_modules            # anonymous volume so host node_modules don't override
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atmograph-network

# ──────────────────────────────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────────────────────────────
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  redis_data:
    driver: local
  model_data:
    driver: local

# ──────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────
networks:
  atmograph-network:
    driver: bridge
    name: atmograph-network
